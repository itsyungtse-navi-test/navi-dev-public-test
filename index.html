<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>貪食蛇 Snake</title>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --grid: #16213a; --text: #e2e8f0; --muted: #94a3b8;
    --snake: #22c55e; --head: #4ade80; --food: #f43f5e; --accent: #38bdf8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Noto Sans TC", "PingFang TC", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; padding: 16px; gap: 12px;
    -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  h1 { margin: 0; font-size: 1.4rem; letter-spacing: .05em; }
  .hud { display: flex; gap: 12px; width: min(92vw, 480px); }
  .stat { flex: 1; background: var(--panel); border-radius: 10px; padding: 8px 12px; }
  .stat .label { font-size: .75rem; color: var(--muted); }
  .stat .value { font-size: 1.4rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .board-wrap { position: relative; width: min(92vw, 480px); aspect-ratio: 1 / 1; }
  canvas { width: 100%; height: 100%; display: block; border-radius: 12px; background: var(--grid);
    box-shadow: 0 10px 30px rgba(0,0,0,.4); touch-action: none; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 10px; background: rgba(15,23,42,.78); border-radius: 12px; text-align: center; padding: 16px; }
  .overlay.hidden { display: none; }
  .overlay h2 { margin: 0; font-size: 1.6rem; }
  .overlay p { margin: 0; color: var(--muted); line-height: 1.6; }
  button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid #334155;
    border-radius: 10px; padding: 8px 16px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #0f172a; border: none; font-weight: 700; }
  .actions { display: flex; gap: 8px; }
  .dpad { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 56px); gap: 6px; }
  .dpad button { font-size: 1.4rem; padding: 0; }
  .dpad .up { grid-column: 2; grid-row: 1; }
  .dpad .left { grid-column: 1; grid-row: 2; }
  .dpad .down { grid-column: 2; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  .hint { font-size: .8rem; color: var(--muted); text-align: center; }
  @media (hover: hover) and (pointer: fine) { .dpad { display: none; } }
</style>
</head>
<body>
  <h1>🐍 貪食蛇</h1>

  <div class="hud">
    <div class="stat"><div class="label">分數</div><div class="value" id="score">0</div></div>
    <div class="stat"><div class="label">最高分</div><div class="value" id="best">0</div></div>
    <div class="stat"><div class="label">速度</div><div class="value" id="level">1</div></div>
  </div>

  <div class="board-wrap">
    <canvas id="board" width="480" height="480" aria-label="貪食蛇遊戲畫面"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ov-title">貪食蛇</h2>
      <p id="ov-text">方向鍵 / WASD 控制方向<br>空白鍵暫停，Enter 開始</p>
      <button class="primary" id="ov-btn">開始遊戲</button>
    </div>
  </div>

  <div class="actions">
    <button id="pause-btn">⏸ 暫停</button>
    <button id="restart-btn">↻ 重新開始</button>
  </div>

  <div class="dpad" aria-label="方向控制">
    <button class="up" data-dir="up" aria-label="上">▲</button>
    <button class="left" data-dir="left" aria-label="左">◀</button>
    <button class="down" data-dir="down" aria-label="下">▼</button>
    <button class="right" data-dir="right" aria-label="右">▶</button>
  </div>

  <div class="hint">手機可在畫面上滑動控制方向</div>

  <script src="src/logic.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
